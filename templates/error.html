<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · Портал 1С</title>
  <style>
    :root { color-scheme: dark light; --bg:#0b1020; --card:#131a2e; --text:#eef2ff; --muted:#9aa7c2; --line:#26304a; --accent:#8b5cf6; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f4f6fb; --card:#ffffff; --text:#101828; --muted:#5b6b86; --line:#dfe5ef; }
    }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
           background:var(--bg); color:var(--text);
           font-family: Inter, "Segoe UI", system-ui, sans-serif; line-height:1.55; }
    .card { width:min(560px, 100%); padding:34px 32px; border:1px solid var(--line);
            border-radius:14px; background:var(--card); }
    .code { font-size:56px; font-weight:700; line-height:1; margin:0 0 10px;
            background:linear-gradient(120deg, var(--accent), #22d3ee); -webkit-background-clip:text;
            background-clip:text; color:transparent; }
    h1 { margin:0 0 12px; font-size:22px; }
    p { margin:0 0 10px; color:var(--muted); font-size:15px; }
    .hint { margin-top:18px; padding-top:16px; border-top:1px solid var(--line); font-size:14px; }
    a.btn { display:inline-block; margin-top:20px; padding:11px 18px; border-radius:9px;
            background:var(--accent); color:#fff; text-decoration:none; font-weight:600; font-size:14px; }
    footer { margin-top:22px; font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">{{ code }}</p>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {% if hint %}<p class="hint">{{ hint }}</p>{% endif %}
    <a class="btn" href="{{ url_for('index') if session.get('uid') else url_for('login') }}">На главную</a>
    <footer>Портал 1С · 1C.DGEK.RU</footer>
  </main>
</body>
</html>
