<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Вход | Портал 1С</title>
  <link rel="icon" href="{{ asset('brand.png') }}">
  <link rel="stylesheet" href="{{ asset('app.css') }}">
  <link rel="stylesheet" href="{{ asset('portal.css') }}">
    <script>try{var m=localStorage.getItem('portal-theme')||'auto';document.documentElement.dataset.theme=(m==='auto'?(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'):m);}catch(e){}</script>
  <script src="{{ asset('theme.js') }}" defer></script>
  <script src="{{ asset('vendor/lucide.js') }}" defer></script>
</head>
<body class="login-page">
  <header class="login-header">
    <a class="brand" href="/"><img class="brand-mark" src="{{ asset('brand.png') }}" alt=""><span class="brand-line">ПОРТАЛ<img class="brand-1c" src="{{ asset('logo1c.png') }}" alt="1С"><span class="brand-version">v{{ app_version }}</span></span></a>
    <div class="theme-switch" role="group" aria-label="Тема оформления">
      <button type="button" data-theme-set="light" title="Светлая тема" aria-label="Светлая тема"><i data-lucide="sun"></i></button>
      <button type="button" data-theme-set="dark" title="Тёмная тема" aria-label="Тёмная тема"><i data-lucide="moon"></i></button>
      <button type="button" data-theme-set="auto" title="Как в системе" aria-label="Как в системе"><i data-lucide="monitor"></i></button>
    </div>
  </header>
  <main class="login-main">
    <div class="login-heading">
      <span class="eyebrow">ДОСТУП К БАЗАМ 1С</span>
      <h1>Ваши базы — в одном окне.</h1>
    </div>
    <form method="post" class="login-form">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      {% if error %}<div class="form-error" role="alert">{{ error }}</div>{% endif %}
      <h2>Вход в портал</h2>
      <label>Логин<input name="username" autocomplete="username" required autofocus placeholder="логин" maxlength="32"></label>
      <label>Пароль<span class="password-input"><input name="password" type="password" autocomplete="current-password" required placeholder="Введите пароль"><button class="icon-button" type="button" id="reveal-password" title="Показать пароль" aria-label="Показать пароль"><i data-lucide="eye"></i></button></span></label>
      <button type="submit" class="button primary login-submit">Войти <i data-lucide="arrow-right"></i></button>
      <div class="login-secure"><i data-lucide="shield-check"></i>Защищённая сессия портала</div>
      <a class="login-qr-link" href="{{ url_for('qr_login_page') }}">
        <i data-lucide="qr-code"></i>Вход администратора по QR-коду
      </a>
    </form>
  </main>
  <footer class="login-footer"><span>Портал 1С <span class="muted">/ v{{ app_version }}</span></span><span class="muted">1С.DGEK.RU</span></footer>
  <div class="credits">проект подготовлен при участии <a href="https://focuslens.dev" target="_blank" rel="noopener">focuslens.dev</a></div>
  <script>
    document.addEventListener('DOMContentLoaded', function () { if (window.lucide) lucide.createIcons(); });
    document.addEventListener('click', function (e) {
      const b = e.target.closest('#reveal-password');
      if (!b) return;
      const inp = b.parentElement.querySelector('input');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    });
  </script>
</body>
</html>
